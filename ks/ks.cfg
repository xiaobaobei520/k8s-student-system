#version=RHEL9
# Rocky Linux 9.6 无人值守安装 - k8s 实验环境
text
firstboot --disable
lang en_US.UTF-8
keyboard us
timezone Asia/Shanghai --utc

rootpw --plaintext K8s@2026

selinux --permissive
firewall --disabled
services --enabled=sshd,chronyd,NetworkManager

# 单块 40GB 磁盘，自动分区，不建 swap（kubelet 要求）
zerombr
clearpart --all --initlabel
autopart --type=lvm --noswap

# 安装阶段先用 DHCP，装完由宿主机脚本改成静态 IP
network --bootproto=dhcp --device=link --activate --hostname=localhost.localdomain

skipx
# 装完关机，宿主机再摘掉光盘后开机，避免重复进入安装程序
poweroff

%packages --ignoremissing
@^minimal-environment
open-vm-tools
vim-enhanced
wget
tar
net-tools
bash-completion
lsof
%end

%post --log=/root/ks-post.log
# 集群 hosts 解析
cat >> /etc/hosts <<'HOSTS'
192.168.221.10 k8s-master
192.168.221.11 k8s-node1
192.168.221.12 k8s-node2
HOSTS

# 允许 root 密码登录 SSH（RHEL9 默认 prohibit-password）
mkdir -p /etc/ssh/sshd_config.d
cat > /etc/ssh/sshd_config.d/99-k8s.conf <<'SSHD'
PermitRootLogin yes
PasswordAuthentication yes
SSHD

systemctl enable sshd
systemctl enable chronyd
systemctl disable firewalld 2>/dev/null || true
systemctl disable kdump 2>/dev/null || true

# k8s 内核模块
cat > /etc/modules-load.d/k8s.conf <<'MOD'
overlay
br_netfilter
MOD
modprobe overlay 2>/dev/null || true
modprobe br_netfilter 2>/dev/null || true

cat > /etc/sysctl.d/k8s.conf <<'SYS'
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1
SYS

# 确认 swap 已关闭
sed -ri 's/.*swap.*/#&/' /etc/fstab 2>/dev/null || true

touch /root/ks-done
%end
