<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生管理系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #111827;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .sub { font-size: 13px; color: #6b7280; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .card .value { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .card .value.small { font-size: 14px; font-weight: 500; word-break: break-all; }

  .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  .toolbar {
    display: flex; gap: 10px; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid #f0f1f3;
  }
  .toolbar input {
    flex: 1; max-width: 280px; height: 34px; padding: 0 12px;
    border: 1px solid #d1d5db; border-radius: 7px; font-size: 13px; outline: none;
  }
  .toolbar input:focus { border-color: #2563eb; }
  .spacer { flex: 1; }

  button {
    height: 34px; padding: 0 14px; border-radius: 7px; font-size: 13px;
    border: 1px solid #d1d5db; background: #fff; color: #374151;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  button:hover { background: #f9fafb; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.link {
    border: none; background: none; color: #2563eb; padding: 0 6px; height: auto;
  }
  button.link.danger { color: #dc2626; }
  button.link:hover { text-decoration: underline; background: none; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 16px; text-align: left; font-size: 13px; }
  th {
    background: #fafbfc; color: #6b7280; font-weight: 500;
    border-bottom: 1px solid #e5e7eb; white-space: nowrap;
  }
  td { border-bottom: 1px solid #f3f4f6; }
  td:last-child { white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  .empty { padding: 40px; text-align: center; color: #9ca3af; font-size: 13px; }

  .tag {
    display: inline-block; padding: 1px 8px; border-radius: 20px;
    font-size: 12px; background: #eef2ff; color: #4338ca;
  }
  .tag.f { background: #fdf2f8; color: #be185d; }

  .badge {
    font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; }
  .dot.cache { background: #d97706; }

  .mask {
    position: fixed; inset: 0; background: rgba(17,24,39,.45);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .mask.show { display: flex; }
  .dialog {
    background: #fff; border-radius: 12px; width: 420px; max-width: 92vw;
    padding: 20px 22px;
  }
  .dialog h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; height: 36px; padding: 0 11px; font-size: 13px;
    border: 1px solid #d1d5db; border-radius: 7px; outline: none; background: #fff;
  }
  .field input:focus, .field select:focus { border-color: #2563eb; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>学生管理系统</h1>
    <span class="sub">FastAPI + MySQL + Redis · 运行在 Kubernetes</span>
  </header>

  <div class="cards">
    <div class="card">
      <div class="label">学生总数</div>
      <div class="value" id="total">-</div>
    </div>
    <div class="card">
      <div class="label">班级分布</div>
      <div class="value small" id="byClass">-</div>
    </div>
    <div class="card">
      <div class="label">后端实例 / 数据来源</div>
      <div class="value small" id="backend">-</div>
    </div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <input id="kw" placeholder="搜索姓名、学号或班级" autocomplete="off">
      <button id="searchBtn">搜索</button>
      <button id="resetBtn">重置</button>
      <div class="spacer"></div>
      <div class="badge" id="sourceBadge"><span class="dot"></span><span>数据源 -</span></div>
      <button class="primary" id="addBtn">+ 新增学生</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:110px">学号</th>
          <th style="width:90px">姓名</th>
          <th style="width:70px">性别</th>
          <th>班级</th>
          <th>邮箱</th>
          <th style="width:110px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">暂无数据</div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="dialog">
    <h2 id="dlgTitle">新增学生</h2>
    <input type="hidden" id="sid">
    <div class="field"><label>学号</label><input id="f_no" placeholder="如 2024001"></div>
    <div class="field"><label>姓名</label><input id="f_name" placeholder="如 张三"></div>
    <div class="field">
      <label>性别</label>
      <select id="f_gender"><option>男</option><option>女</option></select>
    </div>
    <div class="field"><label>班级</label><input id="f_class" placeholder="如 计算机2401"></div>
    <div class="field"><label>邮箱</label><input id="f_email" placeholder="选填"></div>
    <div class="actions">
      <button id="cancelBtn">取消</button>
      <button class="primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let keyword = "";

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => { t.className = "toast"; }, 2200);
}

async function api(path, opts) {
  const res = await fetch("/api" + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ("请求失败 " + res.status));
  return data;
}

function setSource(src) {
  const badge = $("sourceBadge");
  const dot = badge.querySelector(".dot");
  const label = badge.querySelector("span:last-child");
  if (src === "redis") {
    dot.className = "dot cache";
    label.textContent = "数据源 Redis 缓存";
  } else {
    dot.className = "dot";
    label.textContent = "数据源 MySQL";
  }
}

async function loadStats() {
  try {
    const s = await api("/stats");
    $("total").textContent = s.total;
    $("byClass").textContent = s.by_class.length
      ? s.by_class.map(r => r.class_name + " " + r.cnt).join(" · ")
      : "暂无";
  } catch (e) {
    $("total").textContent = "!";
    $("byClass").textContent = "数据库未就绪";
  }
}

async function loadBackend() {
  try {
    const h = await api("/health");
    $("backend").textContent = (h.mysql ? "MySQL 正常" : "MySQL 异常")
      + " / " + (h.redis ? "Redis 正常" : "Redis 异常")
      + " · " + h.pod;
  } catch (e) {
    $("backend").textContent = "后端不可用";
  }
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function loadStudents() {
  const q = keyword ? "?keyword=" + encodeURIComponent(keyword) : "";
  try {
    const data = await api("/students" + q);
    setSource(data.source);
    const rows = data.items || [];
    const tb = $("tbody");
    tb.innerHTML = rows.map(s => `
      <tr>
        <td>${esc(s.student_no)}</td>
        <td>${esc(s.name)}</td>
        <td><span class="tag${s.gender === "女" ? " f" : ""}">${esc(s.gender)}</span></td>
        <td>${esc(s.class_name)}</td>
        <td>${esc(s.email || "-")}</td>
        <td>
          <button class="link" onclick="editStudent(${s.id})">编辑</button>
          <button class="link danger" onclick="delStudent(${s.id}, '${esc(s.name)}')">删除</button>
        </td>
      </tr>`).join("");
    $("empty").style.display = rows.length ? "none" : "block";
    window.__rows = rows;
  } catch (e) {
    toast(e.message, true);
  }
}

function openDialog(s) {
  $("sid").value = s ? s.id : "";
  $("dlgTitle").textContent = s ? "编辑学生" : "新增学生";
  $("f_no").value = s ? s.student_no : "";
  $("f_name").value = s ? s.name : "";
  $("f_gender").value = s ? s.gender : "男";
  $("f_class").value = s ? s.class_name : "";
  $("f_email").value = s ? (s.email || "") : "";
  $("mask").classList.add("show");
}

function editStudent(id) {
  const s = (window.__rows || []).find(r => r.id === id);
  if (s) openDialog(s);
}

async function delStudent(id, name) {
  if (!confirm("确定删除「" + name + "」吗？")) return;
  try {
    await api("/students/" + id, { method: "DELETE" });
    toast("已删除");
    refresh();
  } catch (e) {
    toast(e.message, true);
  }
}

async function save() {
  const id = $("sid").value;
  const body = {
    student_no: $("f_no").value.trim(),
    name: $("f_name").value.trim(),
    gender: $("f_gender").value,
    class_name: $("f_class").value.trim(),
    email: $("f_email").value.trim() || null,
  };
  if (!body.student_no || !body.name || !body.class_name) {
    toast("学号、姓名、班级不能为空", true);
    return;
  }
  try {
    if (id) {
      await api("/students/" + id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      toast("已更新");
    } else {
      await api("/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      toast("已添加");
    }
    $("mask").classList.remove("show");
    refresh();
  } catch (e) {
    toast(e.message, true);
  }
}

function refresh() {
  loadStudents();
  loadStats();
  loadBackend();
}

$("addBtn").onclick = () => openDialog(null);
$("cancelBtn").onclick = () => $("mask").classList.remove("show");
$("saveBtn").onclick = save;
$("searchBtn").onclick = () => { keyword = $("kw").value.trim(); loadStudents(); };
$("resetBtn").onclick = () => { $("kw").value = ""; keyword = ""; loadStudents(); };
$("kw").addEventListener("keydown", e => {
  if (e.key === "Enter") { keyword = $("kw").value.trim(); loadStudents(); }
});
$("mask").addEventListener("click", e => {
  if (e.target === $("mask")) $("mask").classList.remove("show");
});

refresh();
</script>
</body>
</html>
